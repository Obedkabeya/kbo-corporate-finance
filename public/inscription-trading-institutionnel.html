<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inscription — Trading institutionnel — KBO Corporate Finance</title>
  <meta name="description" content="Inscription et paiement : Trading institutionnel, KBO Corporate Finance." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/logo/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/logo/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/marches.css" />
  <link rel="stylesheet" href="/css/maison.css" />
</head>
<body data-page="m-inscription-trading" data-nav="" data-entete="simple" data-retour="/admission.html|Retour à l'admission" class="maison">
  <div id="site-header"></div>
  <main id="contenu">
    <section class="checkout">
      <div class="wrap checkout__grille">
        <aside class="checkout__resume" aria-label="Récapitulatif">
          <p class="checkout__marque">KBO Corporate Finance</p>
          <h1 class="checkout__titre">Trading institutionnel</h1>
          <div class="checkout__formules" role="radiogroup" aria-label="Formule">
            <label class="checkout__formule"><input type="radio" name="cycle" value="mensuel" form="achatForm" checked /><span class="checkout__f-nom">Mensuel</span><span class="checkout__f-prix"><span class="num" data-text="priceTradingMonth">89 €</span><small> / mois</small></span></label>
            <label class="checkout__formule"><input type="radio" name="cycle" value="annuel" form="achatForm" /><span class="checkout__f-nom">Annuel</span><span class="checkout__f-prix"><span class="num" data-text="priceTradingYear">800 €</span><small> / an</small></span></label>
          </div>
          <div class="checkout__total"><span>Total</span><strong id="achatTotal">89 €</strong></div>
          <p class="checkout__fcfa" id="achatFcfa"></p>
        </aside>
        <form class="checkout__form" id="achatForm" novalidate>
          <h2 class="checkout__h2">Vos coordonnées</h2>
          <div class="field"><label for="achat_nom">Nom complet</label><input id="achat_nom" name="nom" type="text" autocomplete="name" maxlength="120" required /></div>
          <div class="field"><label for="achat_email">E-mail</label><input id="achat_email" name="email" type="email" autocomplete="email" maxlength="200" required /></div>
          <h2 class="checkout__h2">Moyen de paiement</h2>
          <div class="checkout__moyens" role="radiogroup" aria-label="Moyen de paiement">
            <label class="checkout__moyen"><input type="radio" name="moyen" value="crypto" checked /><span><strong>USDT</strong><small>Réseau Tron (TRC20)</small></span></label>
            <label class="checkout__moyen is-off" id="moyenCarte"><input type="radio" name="moyen" value="carte" disabled /><span><strong>Carte bancaire</strong><small>Bientôt disponible</small></span></label>
          </div>
          <label class="check checkout__risque"><input type="checkbox" name="risques" required /> <span>J'ai lu l'<a href="/risques.html" target="_blank" rel="noopener">avertissement sur les risques</a>.</span></label>
          <button class="btn checkout__payer" type="submit" id="achatCrypto">Payer <span id="achatBouton">89 €</span></button>
          <span class="form-msg" id="achatMsg" role="status"></span>
          <p class="checkout__secu">🔒 Paiement sécurisé par notre prestataire.</p>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/components.js"></script>
  <script src="/js/achat.js"></script>
</body>
</html>
